<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#23715c" />
  <title>おさんぽ記録アプリ（仮）</title>
  <link rel="stylesheet" href="styles/app-styles.css" />
</head>

<body>
  <main class="app-shell">
    <header class="app-header">
      <a class="app-title" href="#home">おさんぽ記録</a>
      <output class="total-points" id="total-points">総ポイント 0</output>
    </header>
    <div id="screen-container"></div>
    <nav class="bottom-navigation" aria-label="メインメニュー">
      <button class="navigation-button" data-screen="home" type="button">⌂<span>ホーム</span></button>
      <button class="navigation-button" data-screen="record" type="button">✎<span>訪問・メモ</span></button>
      <button class="navigation-button" data-screen="history" type="button">▤<span>履歴</span></button>
      <button class="navigation-button" data-screen="points" type="button">★<span>ポイント</span></button>
    </nav>
  </main>
  <dialog id="message-dialog" class="message-dialog">
    <p id="message-text"></p>
    <button class="primary-button" id="close-message" type="button">閉じる</button>
  </dialog>
  <script type="module" src="scripts/app.js"></script>
</body>

</html>
